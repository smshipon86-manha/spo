<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>মেসার্স ধুনট সিড এন্ড এগ্রো ট্রেডার্স — এসপিও অ্যাপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE3;
    --paper-2:#EAE4D4;
    --ink:#22201B;
    --ink-soft:#6B655A;
    --navy:#26344A;
    --navy-2:#374A66;
    --stamp:#B4402A;
    --stamp-soft:#E7C9BF;
    --line:#D8D0BC;
    --ok:#3F7D58;
    --ok-soft:#D9E8DD;
    --gold:#B4862C;
    --gold-soft:#EFE1BF;
    --card:#FFFDF8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Bengali','Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header.app-top{
    background:var(--navy);
    color:#fff;
    padding:14px 16px 12px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .app-top .row1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .app-brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    flex:1 1 auto;
  }
  .app-brand-logo{
    width:46px;
    height:46px;
    object-fit:contain;
    flex:0 0 46px;
    background:#fff;
    border-radius:8px;
    padding:2px;
  }
  .app-top h1{
    flex:1 1 auto;
    min-width:0;
    font-size:16px;
    margin:0;
    font-weight:700;
    letter-spacing:.2px;
    line-height:1.25;
    white-space:normal;
    overflow-wrap:normal;
    word-break:normal;
  }
  .app-top .sub{
    font-size:12px;
    color:#C7CEDA;
    margin-top:4px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .conn-dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:#8FBF9F;
    flex-shrink:0;
  }
  .conn-dot.off{background:var(--stamp-soft);}
  .spo-edit-link{
    color:#C7CEDA;
    text-decoration:underline;
    cursor:pointer;
    font-size:11px;
    margin-left:4px;
  }
  .back-home-btn{
    background:none;
    border:1px solid #4A5A73;
    color:#fff;
    border-radius:6px;
    padding:4px 10px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---------- mobile header + dashboard optimization ---------- */
  @media (max-width:600px){
    header.app-top{padding:9px 10px 8px;}
    .app-top .row1{gap:7px;align-items:center;min-width:0;}
    .app-brand{gap:7px;min-width:0;width:100%;overflow:hidden;}
    .app-brand-logo{width:40px;height:40px;flex:0 0 40px;border-radius:7px;}
    .app-top h1{
      font-size:13px;
      line-height:1.15;
      letter-spacing:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
      margin:0;
    }
    .app-top .sub{font-size:11px;line-height:1.3;flex-wrap:wrap;row-gap:2px;margin-top:3px;}
    .spo-edit-link{font-size:10px;}
    .back-home-btn{padding:4px 7px;font-size:11px;flex:0 0 auto;}
    #statsContainer{margin-top:4px;}
    .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .stat-card{min-width:0;padding:11px 10px;border-radius:10px;}
    .stat-card .label{font-size:11px;line-height:1.3;}
    .stat-card .value{font-size:17px;line-height:1.2;white-space:nowrap;}
    .stat-card .note{font-size:10px;line-height:1.25;}
  }
  @media (max-width:380px){
    .app-top h1{font-size:12px;}
    .app-brand-logo{width:38px;height:38px;flex-basis:38px;}
    .app-top .sub{font-size:10.5px;}
    .stat-grid{gap:7px;}
    .stat-card{padding:10px 8px;}
    .stat-card .value{font-size:15px;}
  }

  .steps-bar{
    display:flex;
    gap:0;
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
  }
  .step-tab{
    flex:1;
    text-align:center;
    padding:10px 4px;
    font-size:12px;
    color:var(--ink-soft);
    border-bottom:3px solid transparent;
    position:relative;
  }
  .step-tab .num{
    display:inline-block;
    width:18px;height:18px;
    line-height:18px;
    border-radius:50%;
    background:var(--line);
    color:var(--ink-soft);
    font-size:11px;
    margin-right:4px;
    font-weight:600;
  }
  .step-tab.active{color:var(--navy);border-bottom-color:var(--stamp);}
  .step-tab.active .num{background:var(--stamp);color:#fff;}
  .step-tab.done .num{background:var(--ok);color:#fff;}

  main{
    flex:1;
    padding:16px;
    max-width:640px;
    width:100%;
    margin:0 auto;
    padding-bottom:100px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .panel + .panel{margin-top:12px;}

  .field-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:500;
  }

  /* ---------- dashboard ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 12px;
  }
  .stat-card.wide{grid-column:1 / -1;}
  .stat-card .label{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .stat-card .value{
    font-size:19px;
    font-weight:700;
    color:var(--navy);
  }
  .stat-card.due .value{color:var(--stamp);}
  .stat-card .note{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .big-order-btn{
    width:100%;
    padding:20px 16px;
    border-radius:var(--radius);
    border:none;
    background:var(--stamp);
    color:#fff;
    font-size:18px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .big-order-btn .arrow{font-size:20px;}

  .option-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option-btn{
    text-align:right;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
    direction:rtl;
    width:100%;
  }
  .option-btn:hover{border-color:var(--navy-2);}
  .option-btn.selected{
    border-color:var(--stamp);
    background:var(--stamp-soft);
    font-weight:600;
  }
  .option-btn .chev{color:var(--ink-soft);font-size:13px;}
  .option-btn .sub-line{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:400;
    margin-top:2px;
  }

  .empty-state{
    padding:24px 12px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .product-row{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    background:#fff;
  }
  .product-row .p-name{
    font-size:15px;
    font-weight:600;
    margin-bottom:2px;
  }
  .product-row .p-stock{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .product-row .p-stock.low{color:var(--stamp);font-weight:600;}
  .qty-inputs{
    display:flex;
    gap:8px;
  }
  .qty-field{flex:1;}
  .qty-field label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .qty-field input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:15px;
    font-family:inherit;
    text-align:center;
  }
  .qty-field input:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
  .qty-field input.invalid{border-color:var(--stamp);background:#FBEAE6;}
  .qty-field.carton input{background:#E9F1FB;border-color:#B9D2EE;color:#1F4E86;font-weight:700;}
  .qty-field.carton input::placeholder{color:#5C82B0;font-weight:600;}
  .qty-field.piece input{background:#FBF1E3;border-color:#EAD3A0;color:#8A5A16;font-weight:700;}
  .qty-field.piece input::placeholder{color:#B0854B;font-weight:600;}
  .qty-field.carton label{color:#1F4E86;font-weight:600;}
  .qty-field.piece label{color:#8A5A16;font-weight:600;}

  .collect-btn{
    width:100%;
    padding:20px 16px;
    border-radius:var(--radius);
    border:none;
    background:var(--navy);
    color:#fff;
    font-size:18px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:10px;
  }

  .activity-row{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    background:#fff;
    cursor:pointer;
  }
  .activity-row .a-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .activity-row .a-name{font-size:14px;font-weight:600;}
  .activity-row .a-date{font-size:11px;color:var(--ink-soft);}
  .activity-status{
    font-size:12px;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .activity-status.pending{background:var(--gold-soft);color:var(--gold);}
  .activity-status.ok{background:var(--ok-soft);color:var(--ok);}
  .activity-status.rejected{background:var(--stamp-soft);color:var(--stamp);}
  .activity-detail{
    display:none;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .activity-row.expanded .activity-detail{display:block;}
  .stock-error{
    font-size:12px;
    color:var(--stamp);
    margin-top:6px;
    font-weight:600;
  }

  .search-box{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    margin-bottom:12px;
  }

  footer.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:10px 16px;
    display:flex;
    gap:10px;
    max-width:640px;
    margin:0 auto;
    z-index:10;
  }
  .btn{
    flex:1;
    padding:13px 10px;
    border-radius:8px;
    border:none;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--paper-2);
    color:var(--ink);
    border:1px solid var(--line);
    flex:0 0 90px;
  }
  .btn-primary{
    background:var(--stamp);
    color:#fff;
  }
  .btn-primary:disabled{
    background:#D8B8AF;
    cursor:not-allowed;
  }
  .btn-primary.ok{background:var(--ok);}

  .toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    z-index:50;
    max-width:90%;
    text-align:center;
  }
  .toast.error{background:var(--stamp);}
  .toast.ok{background:var(--ok);}

  .success-overlay{
    position:fixed;
    inset:0;
    background:rgba(34,32,27,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .success-box{
    background:var(--card);
    border-radius:16px;
    padding:36px 28px;
    text-align:center;
    max-width:320px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .success-check{
    width:76px;
    height:76px;
    border-radius:50%;
    background:var(--ok-soft);
    color:var(--ok);
    font-size:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
  }
  .success-title{
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:6px;
  }
  .success-sub{
    font-size:13px;
    color:var(--ink-soft);
  }

  .login-overlay{
    position:fixed;
    inset:0;
    background:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
  }
  .login-box{
    background:var(--card);
    border-radius:16px;
    padding:32px 26px;
    width:100%;
    max-width:340px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .login-logo{
    display:block;
    width:210px;
    height:auto;
    max-height:145px;
    object-fit:contain;
    margin:0 auto 14px;
  }
  .login-shop{
    font-size:16px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:4px;
  }
  .login-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .login-box input{
    width:100%;
    padding:12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    margin-bottom:10px;
  }
  .login-submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--stamp);
    color:#fff;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:4px;
  }
  .login-error{
    color:var(--stamp);
    font-size:13px;
    margin-top:10px;
    font-weight:600;
  }
  .submit-loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(38,52,74,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:250;
    padding:20px;
    backdrop-filter:blur(2px);
  }
  .submit-loading-box{
    background:var(--card);
    border-radius:16px;
    padding:28px 26px;
    width:min(300px,90vw);
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,.3);
  }
  .submit-loading-logo{
    width:105px;
    height:70px;
    object-fit:contain;
    display:block;
    margin:0 auto 12px;
    animation:submitLogoSpin 1.25s linear infinite;
    transform-origin:center center;
  }
  @keyframes submitLogoSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .submit-loading-title{
    font-size:18px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:4px;
  }
  .submit-loading-sub{
    font-size:13px;
    color:var(--ink-soft);
  }

  .loading-dot{
    text-align:center;
    padding:30px;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* ---------- invoice-style review ---------- */
  .invoice-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .invoice-head{
    background:var(--navy);
    color:#fff;
    padding:14px 16px 12px;
    text-align:center;
  }
  .invoice-shop{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .invoice-sub{font-size:11px;color:#C7CEDA;margin-top:3px;}
  .invoice-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 14px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    background:var(--paper-2);
  }
  .invoice-meta span{display:block;color:var(--ink-soft);font-size:10px;margin-bottom:1px;}
  .invoice-meta b{font-size:13px;font-weight:600;}
  .invoice-table-wrap{overflow-x:auto;}
  table.invoice-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .invoice-table thead th{
    background:#fff;
    text-align:right;
    padding:9px 10px;
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:600;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .invoice-table thead th.inv-th-name{text-align:left;}
  .invoice-table tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .invoice-table tbody tr:nth-child(even){background:#FBF8F1;}
  .inv-td-name{text-align:left;font-weight:600;max-width:150px;}
  .inv-td-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .inv-td-total{color:var(--ink);font-weight:700;}
  .invoice-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    background:var(--ok-soft);
    border-top:2px solid var(--ok);
    font-weight:700;
    font-size:14px;
  }
  .invoice-total-row .amt{font-size:19px;color:var(--ok);}
</style>
</head>
<body>

// ---------------- SPO নাম (একবার লিখলে ফোনেই সেভ থাকবে) ----------------
function loadSpoName(){ try{ return localStorage.getItem('spo_name') || ''; }catch(e){ return ''; } }
function saveSpoName(n){ try{ localStorage.setItem('spo_name', n); }catch(e){} }
let SPO_NAME = loadSpoName();

function ensureSpoName(){
  if(!SPO_NAME){
    const n = window.prompt('আপনার নাম লিখুন (এসপিও):', '');
    if(n && n.trim()){ SPO_NAME = n.trim(); saveSpoName(SPO_NAME); }
  }
  document.getElementById('spoNameDisplay').textContent = SPO_NAME || '—';
}
function changeSpoName(){
  const n = window.prompt('নাম পরিবর্তন করুন:', SPO_NAME || '');
  if(n && n.trim()){
    SPO_NAME = n.trim();
    saveSpoName(SPO_NAME);
    document.getElementById('spoNameDisplay').textContent = SPO_NAME;
  }
}

// ---------------- app/login state helpers ----------------
// এই helper-গুলো login flow-এর প্রতিটি জায়গা থেকে ব্যবহার করা হয়।
let appLoggedIn = false;

function setLoggedIn(value){
  appLoggedIn = !!value;
  const app = document.getElementById('appRoot');
  const login = document.getElementById('loginOverlay');
  if(app) app.style.display = appLoggedIn ? 'block' : 'none';
  if(login) login.style.display = appLoggedIn ? 'none' : 'flex';
}

function showApp(){
  setLoggedIn(true);
  ensureSpoName();
  updateOnlineStatus();
  renderStep();
}

function boot(){
  ensureSpoName();
  updateOnlineStatus();
  renderStep();
}
document.getElementById('editSpoBtn').onclick = changeSpoName;
document.getElementById('logoutBtn').onclick = async ()=>{
  if(confirm('লগআউট করতে চান?')){
    stopListening();
    try{ await firebase.auth().signOut(); }catch(e){ console.error('Firebase logout failed:', e); }
    setLoggedIn(false);
    showLogin();
  }
};

// ---------------- state ----------------
let routes = [];
let retailers = [];    // {route, name, trader, address, mobile, currentDue, collections:[{date,amount}], id}

let retailerCollectionsLive = [];

function getStepLabels(){
  return flowMode === 'collection'
    ? ['রুট', 'রিটেইলার', 'টাকা', 'রিভিউ']
    : ['রুট', 'রিটেইলার', 'পণ্য', 'রিভিউ'];
}

function showToast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

// অর্ডার/কালেকশন Firebase-এ পাঠানোর সময় বড় লোডিং লোগো দেখানো
let submitLoadingOverlay = null;
function startSubmitLoading(message='ডেটা পাঠানো হচ্ছে…'){
  stopSubmitLoading();
  const overlay = document.createElement('div');
  overlay.className = 'submit-loading-overlay';
  overlay.innerHTML = `
    <div class="submit-loading-box">
      <img class="submit-loading-logo" src="${data_uri}" alt="লোড হচ্ছে" />
      <div class="submit-loading-title">অপেক্ষা করুন</div>
      <div class="submit-loading-sub">${message}</div>
    </div>`;
  document.body.appendChild(overlay);
  submitLoadingOverlay = overlay;
}
function stopSubmitLoading(){
  if(submitLoadingOverlay){
    submitLoadingOverlay.remove();
    submitLoadingOverlay = null;
  }
}

// সাবমিট সফল হলে বড় করে মাঝখানে টিক চিহ্ন দেখিয়ে তারপর হোমপেজে ফিরিয়ে দেওয়া
function showSuccessPopup(title, subtitle, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'success-overlay';
  overlay.innerHTML = `
    <div class="success-box">
      <div class="success-check">✓</div>
      <div class="success-title">${title}</div>
      <div class="success-sub">${subtitle}</div>
    </div>`;
  document.body.appendChild(overlay);
  const finish = ()=>{ overlay.remove(); if(onDone) onDone(); };
  overlay.onclick = finish;
  setTimeout(finish, 1800);
}

function setConn(ok, msg){
  connDot.className = 'conn-dot' + (ok ? '' : ' off');
  connText.textContent = msg;
}

function updateOnlineStatus(){
  if(!navigator.onLine){
    setConn(false, 'ইন্টারনেট সংযোগ নেই ⚠️');
  }
}

// প্যাকেজিং থেকে প্রতি কার্টুনে কত পিস তা বের করা (অ্যাডমিন ফাইলের নিয়ম অনুযায়ী)
function getPiecesPerCarton(product){
  const stored = parseFloat(product?.piecesPerCarton || product?.pieces || product?.cartonPieces || 0) || 0;
  const name = String(product?.name || '').toUpperCase().replace(/\s+/g, '');
  const m = name.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)(?:X(\d+(?:\.\d+)?))?/);
  if(m){
    const first = parseFloat(m[1]) || 0;
    const second = parseFloat(m[2]) || 0;
    const third = m[3] ? parseFloat(m[3]) || 0 : 0;
    if(third > 0) return first * second;
    if(first > 0) return first;
  }
  return stored > 0 ? stored : 1;
}

function getPiecePrice(product){
  const cartonPrice = Number(product?.price || 0) || 0;
  const ppc = getPiecesPerCarton(product);
  if(cartonPrice <= 0 || ppc <= 0) return Number(product?.piecePrice || 0) || 0;
  return Math.round((cartonPrice / ppc) * 100) / 100;
}

// পণ্যের ফিজিক্যাল স্টক (কার্টুন এককে)
function getPhysicalStockQty(productName){
  const st = stocks.find(s=>s.productName===productName);
  return st ? (Number(st.qty)||0) : 0;
}

// এখনো সিদ্ধান্ত হয়নি এমন (status: pending) অনলাইন অর্ডারগুলোতে এই পণ্যের
// জন্য কত পরিমাণ "বুক" হয়ে আছে (কার্টুন এককে) — যাতে একই স্টক দুইবার
// অর্ডার না হয়ে যায়, যতক্ষণ না অ্যাডমিন সেটা এপ্রুভ/বাতিল করেন।
function getReservedQtyCartons(productName){
  const prod = products.find(p=>p.name===productName);
  const ppc = getPiecesPerCarton(prod);
  let total = 0;
  pendingOrders.forEach(o=>{
    // যে অর্ডারটা এখন এডিট করা হচ্ছে, সেটার নিজের আগের বুকিং এই হিসাবে
    // ধরা হচ্ছে না — নাহলে নিজেরই আগে করা অর্ডার নিজের সাথে যুক্ত হয়ে
    // স্টক কম দেখাতো।
    if(editingOrderId && o.id === editingOrderId) return;
    (o.items||[]).forEach(it=>{
      if(it.productName===productName){
        total += (Number(it.cartonQty)||0) + (Number(it.pieceQty)||0)/ppc;
      }
    });
  });
  return total;
}

// SR/SPO-কে দেখানো "আসলে কতটা অর্ডার করা যাবে" — ফিজিক্যাল স্টক বাদে
// যা অন্য পেন্ডিং অর্ডারে বুক হয়ে আছে
function getAvailableStockQty(productName){
  return Math.max(0, getPhysicalStockQty(productName) - getReservedQtyCartons(productName));
}

function getOverStockAmount(name, cartonQty, pieceQty){
  const p = products.find(x=>x.name===name);
  if(!p) return 0;
  const ppc = getPiecesPerCarton(p);
  const availableCartons = getAvailableStockQty(name);
  const requestedCartons = (Number(cartonQty)||0) + (Number(pieceQty)||0)/ppc;
  return requestedCartons > availableCartons + 1e-9 ? (requestedCartons - availableCartons) : 0;
}

function getCurrentBanglaDate(){
  const date = new Date();
  const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  const toBn = v => String(v).replace(/[0-9]/g, d=>bn[Number(d)]);
  return `${toBn(date.getDate())}-${months[date.getMonth()]}-${toBn(date.getFullYear())}`;
}

// অ্যাডমিন ফাইলের সাথে মিলিয়ে বাংলা/ISO তারিখ পার্স করা (ড্যাশবোর্ডের হিসাবের জন্য)
function parseBanglaOrISODate(value){
  if(!value) return null;
  const str = String(value).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return new Date(str + 'T00:00:00');
  const bn = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
  const normalized = str.replace(/[০-৯]/g, c=>bn[c]);
  const banglaMonths = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const m1 = normalized.match(/^(\d{1,2})-([^\d-]+)-(\d{4})$/);
  if(m1){
    const idx = banglaMonths.indexOf(m1[2].trim());
    if(idx !== -1) return new Date(`${m1[3]}-${String(idx+1).padStart(2,'0')}-${String(m1[1]).padStart(2,'0')}T00:00:00`);
  }
  const m2 = normalized.match(/(\d{1,2})-(\d{1,2})-(\d{4})/);
  if(m2) return new Date(`${m2[3]}-${String(m2[2]).padStart(2,'0')}-${String(m2[1]).padStart(2,'0')}T00:00:00`);
  return null;
}
function toLocalISODate(d){
  if(!d || isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getLocalISODate(){ return toLocalISODate(new Date()); }

function startListening(){
  stopListening(); const authUser=firebase.auth().currentUser; if(!authUser) return;
  const unsubApp=db.collection('sales_system').doc('appData').onSnapshot((doc)=>{ if(navigator.onLine) setConn(true,'সংযুক্ত'); if(doc.exists){const data=doc.data(); routes=Array.isArray(data.routes)?data.routes:[]; retailers=Array.isArray(data.retailers)?data.retailers:[]; products=Array.isArray(data.products)?data.products:[]; stocks=Array.isArray(data.stocks)?data.stocks:[];} renderStep(); },(err)=>{console.error('appData read error:',err);setConn(false,'ডেটা পড়ার সমস্যা');});
  const unsubInvoices=db.collection('sales_invoices').onSnapshot((snap)=>{invoices=snap.docs.map(d=>d.data());if(step===0)renderStep();},(err)=>console.error('invoice read error:',err));
  const unsubOrders=db.collection('online_orders').where('createdByUid','==',authUser.uid).onSnapshot((snap)=>{allOrders=snap.docs.map(d=>d.data());pendingOrders=allOrders.filter(o=>!o.status||o.status==='pending');if(step===0||step===3)renderStep();},(err)=>console.error('online_orders read error:',err));
  const unsubCollections=db.collection('online_collections').where('createdByUid','==',authUser.uid).onSnapshot((snap)=>{allCollections=snap.docs.map(d=>d.data());if(step===0)renderStep();},(err)=>console.error('online_collections read error:',err));
  // Admin Dashboard-এর কালেকশন কার্ডে ব্যবহৃত নতুন retailer_collections-ও লাইভ নেওয়া হচ্ছে,
  // যাতে SPO-র Dashboard-এ একই উৎসের হিসাব দেখা যায়।
  const unsubRetailerCollections=db.collection('retailer_collections').onSnapshot((snap)=>{retailerCollectionsLive=snap.docs.map(d=>d.data());if(step===0)renderStep();},(err)=>console.error('retailer_collections read error:',err));
  stopDataListeners=[unsubApp,unsubInvoices,unsubOrders,unsubCollections,unsubRetailerCollections];
}

// প্রদত্ত তারিখের (বা আজকের) জন্য বাংলা তারিখ স্ট্রিং বানানো
function formatBanglaDate(dateObjOrISO){
  const d = typeof dateObjOrISO === 'string' ? new Date(dateObjOrISO + 'T00:00:00') : dateObjOrISO;
  const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  const toBn = v => String(v).replace(/[0-9]/g, x=>bn[Number(x)]);
  return `${toBn(d.getDate())}-${months[d.getMonth()]}-${toBn(d.getFullYear())}`;
}

// অ্যাডমিন ফাইলের মতোই মোট স্টকের মূল্য (MRP থেকে ১৫% বাদ দিয়ে)
function computeStockValue(){
  const totalMRP = stocks.reduce((sum, st)=>{
    const prod = products.find(p=>p.name===st.productName);
    const cartonPrice = Number(prod?.price || 0) || 0;
    return sum + (Number(st.qty||0)||0) * cartonPrice;
  }, 0);
  return totalMRP * 0.85;
}

function computeDashboardStats(){
  // Admin Dashboard-এর ৪টি কার্ডের একই ক্রম, একই উৎস ও একই হিসাব রাখা হয়েছে।
  const today = getLocalISODate();
  const dayInvoices = invoices.filter(inv=>{
    const parsed = parseBanglaOrISODate(inv.date || '');
    return parsed && toLocalISODate(parsed) === today;
  });
  const daySales = dayInvoices.reduce((s,inv)=>s+(Number(inv.totalAmount||0)||0), 0);

  let dayCollectionTotal = 0, dayCollectionCount = 0;
  retailers.forEach(ret=>{
    (ret.collections||[]).forEach(c=>{
      const d = parseBanglaOrISODate(c.date || '');
      if(d && toLocalISODate(d) === today){
        dayCollectionTotal += Number(c.amount||0) || 0;
        dayCollectionCount++;
      }
    });
  });
  (retailerCollectionsLive || []).forEach(c=>{
    const d = parseBanglaOrISODate(c.date || '');
    if(d && toLocalISODate(d) === today){
      dayCollectionTotal += Number(c.amount||0) || 0;
      dayCollectionCount++;
    }
  });

  const totalDue = retailers.reduce((s,r)=>s + Math.max(0, Number(r.currentDue||0)||0), 0);
  const stockValueMRP = stocks.reduce((sum, st)=>{
    const prod = products.find(p=>p.name===st.productName);
    const cartonEquivalent = Math.max(0, Number(st.qty||0) || 0);
    const cartonPrice = Number(prod?.price || prod?.cartonPrice || 0) || 0;
    return sum + cartonEquivalent * cartonPrice;
  }, 0);
  const stockValue = stockValueMRP * 0.85;

  return {
    daySales, dayInvoiceCount: dayInvoices.length,
    stockValue,
    dayCollectionTotal, dayCollectionCount,
    totalDue
  };
}

function getMyActivity(){
  const myOrders = allOrders.filter(o=>o.srName===SPO_NAME).map(o=>({
    type:'order', id:o.id, date:o.date||'', createdAt:o.createdAt||0, status:o.status||'pending',
    retailerLabel: (o.retailerTrader||o.retailerName||'—') + (o.retailerName && o.retailerTrader ? ' ('+o.retailerName+')' : ''),
    route:o.route||'', items:o.items||[]
  }));
  const myCols = allCollections.filter(o=>o.srName===SPO_NAME).map(o=>({
    type:'collection', id:o.id, date:o.date||'', createdAt:o.createdAt||0, status:o.status||'pending',
    retailerLabel: (o.retailerTrader||o.retailerName||'—') + (o.retailerName && o.retailerTrader ? ' ('+o.retailerName+')' : ''),
    route:o.route||'', amount:o.amount||0, note:o.note||''
  }));
  const all = [...myOrders, ...myCols];
  const filtered = all.filter(item=>{
    const d = parseBanglaOrISODate(item.date || '');
    return d && toLocalISODate(d) === dashboardDate;
  });
  return filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0, 50);
}

function statusMeta(status){
  if(status==='invoiced' || status==='approved') return {cls:'ok', label:'✅ সফল হয়েছে'};
  if(status==='rejected') return {cls:'rejected', label:'❌ বাতিল হয়েছে'};
  return {cls:'pending', label:'⏳ পেন্ডিং'};
}

// পেন্ডিং অবস্থায় থাকা কোনো অর্ডারে কাস্টমার পরে আরও পণ্য নিতে চাইলে,

// যাবে — নতুন আলাদা অর্ডার তৈরি হবে না, একই অর্ডারই আপডেট হবে।
function editOrder(orderId){
  const order = allOrders.find(o=>o.id===orderId);
  if(!order) return;
  if(order.status && order.status!=='pending'){
    showToast('এই অর্ডারটা আর এডিট করা যাবে না (ইতিমধ্যে সিদ্ধান্ত হয়ে গেছে)', 'error');
    return;
  }
  const ret = retailers.find(r=>r.id===order.retailerId) ||
              retailers.find(r=>r.route===order.route && r.trader===order.retailerTrader);
  if(!ret){
    showToast('এই রিটেইলারকে আর তালিকায় পাওয়া যাচ্ছে না', 'error');
    return;
  }
  editingOrderId = order.id;
  selectedRoute = order.route;
  selectedRetailer = ret;
  cart = {};
  (order.items||[]).forEach(it=>{
    cart[it.productName] = {
      productName: it.productName,
      cartonQty: Number(it.cartonQty)||0,
      pieceQty: Number(it.pieceQty)||0
    };
  });
  flowMode = 'order';
  productSearch = '';
  invalidProducts.clear();
  step = 3;
  renderStep();
}

  listEl.innerHTML = items.map(item=>{

    const detail = item.type==='order'
      ? item.items.map(it=>`${it.productName} — ${it.cartonQty? it.cartonQty+' কার্টুন' : ''}${it.cartonQty && it.pieceQty ? ' + ' : ''}${it.pieceQty? it.pieceQty+' পিস' : ''}`).join('<br/>')
      : `জমার টাকা: ৳${Number(item.amount||0).toLocaleString('en-BD')}${item.note ? '<br/>নোট: '+item.note : ''}`;
    const canEdit = item.type==='order' && st.cls==='pending';
    return `
      <div class="activity-row ${expandedActivityId===item.id ? 'expanded' : ''}" onclick="toggleActivity('${item.id}')">
        <div class="a-top">
          <div>
            <div class="a-name">${item.retailerLabel}</div>
            <div class="a-date">${item.route} · ${item.date} · ${item.type==='order' ? 'অর্ডার' : 'কালেকশন'}</div>
          </div>
          <span class="activity-status ${st.cls}">${st.label}</span>
        </div>
        <div class="activity-detail">${detail}${canEdit ? `<br/><button type="button" class="btn" style="margin-top:8px;padding:8px 12px;font-size:13px;background:var(--navy);color:#fff;border:none;border-radius:6px;" onclick="event.stopPropagation(); editOrder('${item.id}')">✏️ এডিট করে আরও পণ্য যুক্ত করুন</button>` : ''}</div>
      </div>`;
  }).join('');
}

function renderRouteStep(){
  bottomBar.style.display = 'none';
  if(routes.length===0){
    mainArea.innerHTML = `<div class="panel"><div class="empty-state">কোনো রুট পাওয়া যায়নি।</div></div>`;
    return;
  }
  mainArea.innerHTML = `
    <div class="panel">
      <div class="field-label">রুট বেছে নিন</div>
      <div class="option-list" id="routeList"></div>
    </div>`;
  const list = document.getElementById('routeList');
  routes.forEach(r=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (selectedRoute===r ? ' selected' : '');
    btn.innerHTML = `<span>${r}</span><span class="chev">‹</span>`;
    btn.onclick = ()=>{
      selectedRoute = r;
      selectedRetailer = null;
      step = 2;
      renderStep();

function formatMobile(m){
  if(!m) return '';
  const s = String(m).trim();
  return s.startsWith('0') ? s : ('0' + s);
}

function renderRetailerStep(){
  bottomBar.style.display = 'flex';
  nextBtn.className = 'btn btn-primary';
  nextBtn.textContent = 'পরে';
  nextBtn.disabled = !selectedRetailer;
  nextBtn.onclick = ()=>{ step=3; renderStep(); };
  backBtn.onclick = ()=>{ step=1; renderStep(); };

  const list = retailers.filter(r=>r.route===selectedRoute);
  mainArea.innerHTML = `
    <div class="panel">
      <div class="field-label">"${selectedRoute}" রুটের রিটেইলার বেছে নিন</div>
      <div class="option-list" id="retailerList"></div>
    </div>`;
  const wrap = document.getElementById('retailerList');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty-state">এই রুটে কোনো রিটেইলার নেই।</div>`;
    return;
  }
  list
    .slice()
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))
    .forEach(r=>{

      btn.className = 'option-btn' + (isSel ? ' selected' : '');

      btn.innerHTML = `<span>${r.trader || r.name}<span class="sub-line">${r.name}${mobileStr ? ' · 📞 '+mobileStr : ''}</span></span><span class="chev">‹</span>`;

}

function renderProductStep(){
  bottomBar.style.display = 'flex';
  nextBtn.className = 'btn btn-primary';
  backBtn.onclick = ()=>{ step=2; renderStep(); };

  mainArea.innerHTML = `
    <div class="panel">
      <div class="field-label">স্টকে থাকা পণ্য থেকে পরিমাণ দিন</div>
      <input class="search-box" id="prodSearch" placeholder="পণ্যের নাম লিখুন (যেমন: A লিখলে A দিয়ে শুরু পণ্য দেখাবে)…" />
      <div id="invalidProductsWarning"></div>
      <div id="prodListContainer"></div>
    </div>`;

  const searchInput = document.getElementById('prodSearch');
  searchInput.value = productSearch;
  searchInput.oninput = (e)=>{
    productSearch = e.target.value;

function updateNextBtnForProducts(){
  const cnt = Object.keys(cart).length;
  nextBtn.textContent = cnt>0 ? `রিভিউ (${cnt})` : 'রিভিউ';
  nextBtn.disabled = cnt===0 || invalidProducts.size>0;
  nextBtn.onclick = ()=>{ step=4; renderStep(); };

  // সার্চ করে অন্য পণ্য দেখতে গেলে আগে যোগ করা কোনো "স্টকের চেয়ে বেশি"
  // পণ্য তালিকার বাইরে চলে যেতে পারে — তখন সেটা চোখে না পড়ায় "রিভিউ"
  // বাটন সাদা/নিষ্ক্রিয় থেকে যায় অথচ বোঝা যায় না কেন। তাই এখানে
  // স্পষ্টভাবে দেখিয়ে দেওয়া হচ্ছে ঠিক কোন পণ্যে এখনো সমস্যা আছে।
  const warnEl = document.getElementById('invalidProductsWarning');
  if (warnEl) {
    if (invalidProducts.size > 0) {
      const names = Array.from(invalidProducts).join(', ');
      warnEl.innerHTML = `<div style="background:#fdecea;color:#b3261e;border:1px solid #f5c2c0;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px;">⚠️ এই পণ্য(গুলো)-তে স্টকের চেয়ে বেশি লেখা আছে, ঠিক না করা পর্যন্ত রিভিউতে যাওয়া যাবে না: <b>${names}</b></div>`;
    } else {
      warnEl.innerHTML = '';
    }
  }
}

function renderProductListOnly(){
  const inStock = products.filter(p=>getAvailableStockQty(p.name) > 0);
  const q = productSearch.trim().toLowerCase();
  const filtered = q ? inStock.filter(p=>p.name.toLowerCase().startsWith(q)) : inStock;

  const listEl = document.getElementById('prodListContainer');
  updateNextBtnForProducts();

  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty-state">${q ? '"'+q+'" দিয়ে শুরু কোনো পণ্য স্টকে পাওয়া যায়নি।' : 'স্টকে কোনো পণ্য পাওয়া যায়নি।'}</div>`;
    return;
  }

  listEl.innerHTML = '';
  filtered
    .slice()
    .sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(p=>{
      const existing = cart[p.name] || {cartonQty:'', pieceQty:''};
      const availCartons = getAvailableStockQty(p.name);
      const ppc = getPiecesPerCarton(p);
      const isLow = availCartons < 3;
      const over = getOverStockAmount(p.name, existing.cartonQty, existing.pieceQty);
      if(over>0) invalidProducts.add(p.name); else invalidProducts.delete(p.name);
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <div class="p-name">${p.name}</div>
        <div class="p-stock ${isLow ? 'low' : ''}">স্টকে আছে: ${Math.floor(availCartons)} কার্টুন (~${Math.round(availCartons*ppc)} পিস)${isLow ? ' ⚠️ কম' : ''}</div>
        <div class="qty-inputs">
          <div class="qty-field carton">
            <label>কার্টুন</label>
            <input type="number" min="0" inputmode="numeric" data-name="${p.name}" data-kind="cartonQty" value="${existing.cartonQty || ''}" placeholder="কার্টুন" class="${over>0?'invalid':''}" />
          </div>
          <div class="qty-field piece">
            <label>পিস</label>
            <input type="number" min="0" inputmode="numeric" data-name="${p.name}" data-kind="pieceQty" value="${existing.pieceQty || ''}" placeholder="পিস" class="${over>0?'invalid':''}" />
          </div>
        </div>
        <div class="stock-error" style="display:${over>0?'block':'none'};">স্টকের চেয়ে বেশি — সর্বোচ্চ ${Math.floor(availCartons)} কার্টুন (~${Math.round(availCartons*ppc)} পিস) দেওয়া যাবে</div>`;
      listEl.appendChild(row);
    });

  updateNextBtnForProducts();

  listEl.querySelectorAll('input[type="number"]').forEach(inp=>{
    inp.oninput = (e)=>{
      const name = e.target.dataset.name;
      const kind = e.target.dataset.kind;
      const val = Math.max(0, Number(e.target.value)||0);
      if(!cart[name]) cart[name] = {productName: name, cartonQty:0, pieceQty:0};
      cart[name][kind] = val;
      if(!cart[name].cartonQty && !cart[name].pieceQty) delete cart[name];

      const row = e.target.closest('.product-row');
      const errBox = row.querySelector('.stock-error');
      const c = cart[name] || {cartonQty:0, pieceQty:0};
      const over = getOverStockAmount(name, c.cartonQty, c.pieceQty);
      row.querySelectorAll('input[type="number"]').forEach(i=>i.classList.toggle('invalid', over>0));
      errBox.style.display = over>0 ? 'block' : 'none';
      if(over>0) invalidProducts.add(name); else invalidProducts.delete(name);

      updateNextBtnForProducts();
    };
  });
}

function renderReviewStep(){
  bottomBar.style.display = 'flex';
  backBtn.onclick = ()=>{ step=3; renderStep(); };
  nextBtn.textContent = editingOrderId ? 'অর্ডার আপডেট করুন' : 'অর্ডার সাবমিট করুন';
  nextBtn.className = 'btn btn-primary ok';
  nextBtn.disabled = false;
  nextBtn.onclick = submitOrder;

  const items = Object.values(cart);

  let grandTotal = 0;
  let rowsHtml = items.map((it, i)=>{
    const prod = products.find(p=>p.name===it.productName);
    const cartonPrice = Number(prod?.price || 0) || 0;
    const piecePrice = prod ? getPiecePrice(prod) : 0;
    const lineTotal = (it.cartonQty * cartonPrice) + (it.pieceQty * piecePrice);
    grandTotal += lineTotal;
    const qtyParts = [];
    if(it.cartonQty) qtyParts.push(`${it.cartonQty} কার্টুন`);
    if(it.pieceQty) qtyParts.push(`${it.pieceQty} পিস`);
    const unitPrice = it.cartonQty ? cartonPrice : piecePrice;
    const unitLabel = it.cartonQty ? '/কার্টুন' : '/পিস';
    return `
      <tr>
        <td class="inv-td-name">${i+1}. ${it.productName}</td>
        <td class="inv-td-num">${qtyParts.join(' + ')}</td>
        <td class="inv-td-num">৳${unitPrice.toLocaleString('en-BD')}${unitLabel}</td>
        <td class="inv-td-num inv-td-total">৳${lineTotal.toLocaleString('en-BD')}</td>
      </tr>`;
  }).join('');

  mainArea.innerHTML = `
    <div class="invoice-card">
      <div class="invoice-head">
        <div class="invoice-shop">মেসার্স ধুনট সিড এন্ড এগ্রো ট্রেডার্স</div>
        <div class="invoice-sub">অর্ডার রিভিউ · এমআরপি অনুযায়ী</div>
      </div>
      <div class="invoice-meta">
        <div><span>তারিখ</span><b>${getCurrentBanglaDate()}</b></div>
        <div><span>এসপিও</span><b>${SPO_NAME}</b></div>
        <div><span>রুট</span><b>${selectedRoute}</b></div>
        <div><span>রিটেইলার</span><b>${selectedRetailer.trader || selectedRetailer.name}${selectedRetailer.trader && selectedRetailer.name ? ' ('+selectedRetailer.name+')' : ''}</b></div>
      </div>
      ${items.length ? `
      <div class="invoice-table-wrap">
        <table class="invoice-table">
          <thead><tr><th class="inv-th-name">পণ্যের নাম</th><th>পরিমাণ</th><th>একক মূল্য</th><th>মোট</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="invoice-total-row">
        <span>সর্বমোট (এমআরপি)</span>
        <span class="amt">৳${grandTotal.toLocaleString('en-BD')}</span>
      </div>
      <div class="invoice-total-row" style="background:var(--paper-2);border-top:1px dashed var(--line);">
        <span style="font-size:12.5px;color:var(--ink-soft);">সম্ভাব্য দাম (এমআরপি থেকে ১৬% বাদে)</span>
        <span class="amt" style="font-size:16px;color:var(--ink-soft);">৳${Math.round(grandTotal*0.84).toLocaleString('en-BD')}</span>
      </div>` : `<div class="empty-state">কোনো পণ্য যুক্ত করা হয়নি</div>`}
    </div>`;
}

async function submitOrder(){
  // একবার ক্লিক করার পর request শেষ না হওয়া পর্যন্ত দ্বিতীয়বার submit চলবে না।
  if(orderSubmitInProgress) return;
  orderSubmitInProgress = true;
  const authUser=firebase.auth().currentUser;
  if(!authUser){orderSubmitInProgress=false;showToast('Firebase লগইন নেই — আবার লগইন করুন','error');showLogin();return;}
  if(authUser.uid!==SPO_ALLOWED_UID){orderSubmitInProgress=false;showToast('এই Firebase account এই SPO অ্যাপের জন্য অনুমোদিত নয়','error');await firebase.auth().signOut();return;}
  if(!navigator.onLine){orderSubmitInProgress=false;showToast('ইন্টারনেট সংযোগ নেই — আবার চেষ্টা করুন','error');return;}
  const items=Object.values(cart);
  if(!items.length){orderSubmitInProgress=false;showToast('অন্তত একটি পণ্য যুক্ত করুন','error');return;}
  const overItem=items.find(it=>getOverStockAmount(it.productName,it.cartonQty,it.pieceQty)>0);
  if(overItem){orderSubmitInProgress=false;showToast(`"${overItem.productName}" স্টকের চেয়ে বেশি — ঠিক করে আবার চেষ্টা করুন`,'error');step=3;renderStep();return;}

  nextBtn.disabled=true;
  nextBtn.textContent='পাঠানো হচ্ছে…';

  // Fullscreen loading overlay ব্যবহার করা হচ্ছে না; diagnosis সরাসরি দৃশ্যমান থাকবে।
  let box=document.getElementById('orderSubmitStatusBox');
  if(!box){
    box=document.createElement('div');
    box.id='orderSubmitStatusBox';
    box.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:100000;background:#fff;border:2px solid #d08a00;border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-family:inherit;color:#222;';
    document.body.appendChild(box);
  }
  box.innerHTML='<div style="font-size:16px;font-weight:800;">অর্ডার পাঠানো হচ্ছে…</div><div id="orderSubmitStatusText" style="margin-top:6px;font-size:13px;line-height:1.5;">Firebase-এর response-এর জন্য অপেক্ষা করছি।</div>';

  let finished=false;
  let timer5=null,timer12=null;
  const cleanup=()=>{if(timer5)clearTimeout(timer5);if(timer12)clearTimeout(timer12);timer5=null;timer12=null;orderSubmitInProgress=false;nextBtn.disabled=false;nextBtn.textContent='অর্ডার সাবমিট করুন';};
  const showDiag=(code,msg)=>{
    cleanup();
    let b=document.getElementById('orderSubmitStatusBox');
    if(!b){b=document.createElement('div');b.id='orderSubmitStatusBox';b.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:100000;background:#fff;border:2px solid #b42318;border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-family:inherit;color:#222;';document.body.appendChild(b);}
    const c=String(code||'unknown-error').replace(/</g,'&lt;');
    const m=String(msg||'অজানা error').replace(/</g,'&lt;');
    b.style.borderColor='#b42318';
    b.innerHTML='<div style="font-size:17px;font-weight:800;color:#b42318;">অর্ডার পাঠানো যায়নি</div><div style="margin-top:7px;font-size:14px;line-height:1.6;"><b>Firebase error code:</b> '+c+'<br><b>কারণ:</b> '+m+'</div><button type="button" style="margin-top:10px;padding:9px 14px;border:0;border-radius:8px;background:#b42318;color:#fff;font-family:inherit;" onclick="this.parentElement.remove()">ঠিক আছে</button>';
    console.error('ORDER SUBMIT DIAGNOSIS:',code,msg);
  };

  try{
    const isEdit=!!editingOrderId;
    const oldOrder=isEdit?allOrders.find(o=>o.id===editingOrderId):null;
    if(isEdit&&oldOrder&&oldOrder.createdByUid&&oldOrder.createdByUid!==authUser.uid){throw Object.assign(new Error('এই অর্ডারটি আপনার account-এর নয়।'),{code:'app/not-owner'});}
    const ref=isEdit?db.collection('online_orders').doc(editingOrderId):db.collection('online_orders').doc();
    const orderData={id:ref.id,date:getCurrentBanglaDate(),route:selectedRoute,retailerTrader:selectedRetailer.trader||'',retailerId:selectedRetailer.id||'',retailerName:selectedRetailer.name||'',items:items,status:'pending',createdAt:isEdit?(oldOrder?.createdAt||Date.now()):Date.now(),updatedAt:isEdit?Date.now():null,srName:SPO_NAME,createdByUid:authUser.uid};

    timer5=setTimeout(()=>{if(finished)return;const t=document.getElementById('orderSubmitStatusText');if(t)t.innerHTML='<b>⚠️ ৫ সেকেন্ড হয়ে গেছে।</b> Firebase এখনো response দেয়নি। আর একটু অপেক্ষা করছি…';nextBtn.textContent='Firebase response আসছে…';},5000);
    timer12=setTimeout(()=>{if(finished)return;showDiag('app/order-write-timeout','Firebase-এ অর্ডার লেখার response ১২ সেকেন্ডেও আসেনি। Firestore Rules, Firebase connection অথবা network সমস্যা হতে পারে।');},12000);

    console.log('ORDER SUBMIT START',{docId:ref.id,uid:authUser.uid});
    await ref.set(orderData);
    if(finished)return;
    finished=true;
    cleanup();
    const b=document.getElementById('orderSubmitStatusBox');if(b)b.remove();
    cart={};selectedRetailer=null;invalidProducts.clear();editingOrderId=null;
    showSuccessPopup(isEdit?'অর্ডার আপডেট হয়েছে':'অর্ডার সাবমিট হয়েছে','অ্যাডমিনের কাছে নোটিফিকেশন চলে গেছে',()=>{step=0;renderStep();});
  }catch(err){
    if(finished)return;
    finished=true;
    const code=err&&err.code?String(err.code):'unknown-error';
    let msg=err&&err.message?String(err.message):'অজানা Firebase error';
    if(code==='permission-denied'||code==='app/permission-denied'||/permission-denied|missing or insufficient permissions|permission/i.test(msg))msg='Firestore Security Rules এই SPO account-কে online_orders-এ অর্ডার লেখার অনুমতি দিচ্ছে না।';
    else if(code==='unauthenticated'||/unauthenticated/i.test(msg))msg='Firebase login session পাওয়া যাচ্ছে না। আবার লগইন করুন।';
    showDiag(code,msg);
  }
}

function showLogin(){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').style.display = 'none';
}

async function attemptLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if(!email || !password){
    document.getElementById('loginError').textContent = 'Firebase ইমেইল ও পাসওয়ার্ড দিন';
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'লগইন হচ্ছে…';
  try{
    const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
    if(!cred.user){ throw new Error('Firebase user পাওয়া যায়নি'); }
    setLoggedIn(true);
    document.getElementById('loginError').style.display = 'none';
    showApp();
  }catch(err){
    console.error('Firebase login failed:', err);

    const code = (err && err.code) ? String(err.code) : 'unknown-error';
    const messageMap = {
      'auth/invalid-credential': 'ইমেইল বা পাসওয়ার্ড সঠিক নয়। Firebase Users থেকে ঠিক Email/Password ব্যবহার করুন।',
      'auth/invalid-login-credentials': 'ইমেইল বা পাসওয়ার্ড সঠিক নয়। Firebase Users থেকে ঠিক Email/Password ব্যবহার করুন।',
      'auth/user-not-found': 'এই ইমেইলে কোনো Firebase user পাওয়া যায়নি। Authentication → Users-এ Emailটি আছে কি না দেখুন।',
      'auth/wrong-password': 'পাসওয়ার্ড ভুল। Firebase Authentication → Users থেকে সঠিক password দিয়ে চেষ্টা করুন।',
      'auth/operation-not-allowed': 'Firebase-এ Email/Password sign-in চালু নেই। Authentication → Sign-in method থেকে Email/Password Enable করুন।',
      'auth/too-many-requests': 'অনেকবার ভুল login চেষ্টা হয়েছে। কিছুক্ষণ অপেক্ষা করে আবার চেষ্টা করুন।',
      'auth/network-request-failed': 'ইন্টারনেট/Firebase network connection সমস্যা হয়েছে। ইন্টারনেট পরীক্ষা করে আবার চেষ্টা করুন।',
      'auth/user-disabled': 'এই Firebase user accountটি disabled করা আছে। Authentication → Users থেকে account status পরীক্ষা করুন।',
      'auth/invalid-api-key': 'Firebase API key/configuration সমস্যা আছে। HTML-এর Firebase config পরীক্ষা করতে হবে।',
      'auth/app-not-authorized': 'এই domain/app Firebase Authentication-এর জন্য অনুমোদিত নয়। Firebase Authentication settings পরীক্ষা করুন.'
    };

    const diagnosis = messageMap[code] || (err && err.message ? String(err.message) : 'অজানা Firebase login error হয়েছে।');
    const errorBox = document.getElementById('loginError');
    errorBox.innerHTML = '<strong>লগইন করা যায়নি</strong><br>' + diagnosis +
      '<div style="margin-top:7px;font-size:12px;opacity:.9;word-break:break-word;">Firebase error code: <b>' +
      code.replace(/[<>&\"']/g, '') + '</b></div>';
    errorBox.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = 'লগইন করুন';
  }
}

document.getElementById('loginBtn').onclick = attemptLogin;
document.getElementById('loginPass').addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('loginUser').addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });

// পেজ রিফ্রেশে Firebase session থাকলে onAuthStateChanged নিজেই app খুলবে।
</script>
</body>
</html>
